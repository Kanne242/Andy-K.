name: Android / Fire TV APK

on:
  push:
    paths: ["web/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Android-SDK-Lizenzen bestätigen (SDK ist auf dem Runner vorinstalliert)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AKMTube-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
