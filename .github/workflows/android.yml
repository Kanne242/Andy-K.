name: Android / Fire TV APK

on:
  push:
    paths: ["web/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write   # zum Veröffentlichen der APK als GitHub-Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Android-SDK-Lizenzen bestätigen (SDK ist auf dem Runner vorinstalliert)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: App-Schlüssel aus Secret laden (falls hinterlegt)
        env:
          KS: ${{ secrets.AKM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/akmtube.keystore; echo "Fester App-Schlüssel aktiv"; else echo "::warning::Kein AKM_KEYSTORE_BASE64-Secret – signiere mit Debug-Schlüssel"; fi
      - name: APK bauen
        working-directory: android
        env:
          AKM_KEYSTORE_PASSWORD: ${{ secrets.AKM_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk AKMTube.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AKMTube-apk
          path: AKMTube.apk
          if-no-files-found: error
      # Feste Download-Adresse: https://github.com/<user>/<repo>/releases/latest/download/AKMTube.apk
      - name: Als Release veröffentlichen
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AKM Tube 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: AKMTube.apk
          body: |
            Installierbare App für Fire TV, Android TV und Android-Handys.
            Direkter Download (immer die neueste Version): https://github.com/${{ github.repository }}/releases/latest/download/AKMTube.apk
