# AKM Trading Bot – Konfiguration
# Alle Werte sind bewusst konservativ. Erst nach Backtest + Paper-Trading ändern.

[markt]
symbole   = ["BTCUSDT", "ETHUSDT"]   # Perpetual Futures (USDT-margined)
zeitrahmen = "4h"                    # Kerzen-Intervall
start      = "2020-01"               # Beginn Backtest (Jahr-Monat)

[strategie]
# Trendfolge: Donchian-Ausbruch + Trendfilter + ATR-Trailing-Stop
einstieg_lookback = 20     # Ausbruch über das Hoch/Tief der letzten N Kerzen
trendfilter_ema   = 200    # Long nur über, Short nur unter dieser EMA
atr_periode       = 20
stop_atr          = 3.0    # Anfangs- und Trailing-Stop in ATR
shorts_erlaubt    = true

[risiko]
startkapital        = 100.0
risiko_pro_trade    = 0.015  # 1,5 % des Kontos Verlust, wenn der Stop greift (Backtest-Optimum)
max_hebel_gesamt    = 2.0    # Summe aller Positionen max. 2x Kontowert
max_hebel_position  = 1.5    # einzelne Position max. 1,5x Kontowert
tagesverlust_stopp  = 0.05   # ab -5 % an einem Tag: keine neuen Trades bis morgen
drawdown_notbremse  = 0.30   # ab -30 % vom Höchststand: Bot pausiert komplett

[kosten]
gebuehr_taker = 0.0006   # 0,06 % pro Order (konservativ, inkl. Puffer)
slippage      = 0.0003   # 0,03 % schlechterer Ausführungspreis
funding       = true     # historische Funding-Raten einrechnen

[telegram]
# Optional: Benachrichtigung aufs Handy. Token/Chat-ID als Umgebungsvariablen
# AKM_TELEGRAM_TOKEN und AKM_TELEGRAM_CHAT setzen – nie hier eintragen.
aktiv = false
